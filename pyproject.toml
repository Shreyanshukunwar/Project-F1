[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tire-strategy"
version = "0.1.0"
description = "Latent tire degradation estimation and undercut strategy simulation from F1 timing data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shreyanshu Kunwar" }]
dependencies = [
    "fastf1>=3.8,<4",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]